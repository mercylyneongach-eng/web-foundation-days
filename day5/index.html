
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #222;
            margin: 0;
            padding: 30px 16px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #234e70;
            text-align: center;
        }

        .intro {
            text-align: center;
            color: #555;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0 15px;
        }

        button,
        input {
            font: inherit;
            padding: 12px;
            border-radius: 6px;
        }

        button {
            border: none;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .filter {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #filter-input {
            width: 100%;
            border: 1px solid #bbb;
        }

        #status {
            padding: 12px;
            background-color: #e5edf8;
            border-radius: 6px;
            min-height: 20px;
        }

        #users-list {
            list-style: none;
            padding: 0;
        }

        #users-list li {
            background-color: white;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 2px 5px #0000000a;
        }

        #users-list h2 {
            margin-top: 0;
            color: #234e70;
            font-size: 20px;
        }

        #users-list p {
            margin: 8px 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 500px) {
            .controls {
                flex-direction: column;
            }

            .controls button {
                width: 100%;
            }
        }
    </style>

    <script src="users.js" defer></script>
</head>

<body>
    <main>
        <h1>User Directory</h1>

        <p class="intro">
            Load users from an API and filter them by name.
        </p>

        <div class="controls">
            <button id="load-users" type="button">
                Load Users
            </button>

            <div class="filter">
                <label for="filter-input">Filter users by name:</label>
                <input
                    type="text"
                    id="filter-input"
                    placeholder="Type a name..."
                >
            </div>
        </div>

        <p id="status" role="status" aria-live="polite">
            Click "Load Users" to get started.
        </p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
